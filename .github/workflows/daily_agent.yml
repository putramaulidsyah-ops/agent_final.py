name: DailySportNotifier

on:
  schedule:
    # 00:00 UTC sama dengan Jam 07:00 WIB
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan kamu untuk test kirim notif secara manual kapan saja

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        pip install requests

    - name: Run Sport Agent
      run: python agent.py
