name: mysportagent
on:
  schedule:
    - cron: '1 17 * * *'
    - cron: '1 22 * * *'
    - cron: '1 3 * * *'
    - cron: '1 6 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - run: pip install requests pytz
      - run: python agent_final.py
